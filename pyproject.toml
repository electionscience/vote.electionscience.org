[project]
name = "approval-frame"
version = "0.1.0"
description = ""
authors = [{ name = "Felix Sargent", email = "felix@electionscience.org" }]
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
  "django~=6.1.0",
  "pytz>=2026.3.post1",
  "django-extensions>=3.2.3",
  "djangoajax>=3.3",
  "django-environ>=0.14.0",
  "django-sendgrid-v5>=1.2.3",
  "gunicorn>=26.0.0",
  "django-upgrade>=1.31.1",
  "whitenoise>=6.12.0",
  "django-structlog>=10.1.0",
  "django-allauth[socialaccount]>=65.19.0",
  "djlint>=1.44.1",
  "django-widget-tweaks>=1.5.0",
  "sentry-sdk[django]>=2.66.1",
  "pytest>=9.1.1",
  "pytest-django>=4.13.0",
  "django-compressor>=4.5.1",
  "django-libsass>=0.9",
  "django-import-export[all]>=4.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["approval_polls"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "approval_polls.settings"
python_files = "tests.py test_*.py *_tests.py"
filterwarnings = [
  "ignore::DeprecationWarning:compressor\\.base",
  "ignore::DeprecationWarning:widget_tweaks\\.templatetags\\.widget_tweaks",
]

[tool.bandit]
exclude_dirs = ['*_test.py', '*/test_*.py', '*/tests.py']
skips = ["B106"]
